<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Acesso negado</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f6f4; --fg: #1d1d1b; --muted: #8a8a85; }
  @media (prefers-color-scheme: dark) { :root { --bg: #141413; --fg: #ececea; --muted: #7d7d78; } }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--fg);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { text-align: center; padding: 0 16px; }
  p { margin: 0 0 .25rem; color: var(--muted); font-size: .875rem; letter-spacing: .08em; }
  h1 { margin: 0; font-size: 1.5rem; font-weight: 600; }
</style>
</head>
<body>
<main>
  <p>403</p>
  <h1>Acesso negado</h1>
</main>
</body>
</html>
