# Metricaz site (production) — /etc/nginx/sites-available/mtz-site-prd.conf
#   Same layout as the UAT (mtz-site.conf): Django on 127.0.0.1:8101, Node SSR on 127.0.0.1:8100,
#   /static, /media and /assets from disk, old WordPress addresses → 301 (nginx/redirects-site-antigo.map).
#   https://metricaz.com is the only address; http and www redirect to it.

# /api only for the JS of our own pages. A fetch() from the page comes marked same-origin (Sec-Fetch-Site, which JS
# can't set); browsers without Sec-Fetch-* (Safari < 16.4) pass with the X-MTZ-Client header of src/lib/api.ts.
# Typing the address, other sites and a plain curl get 404. Not a lock (a script can fake both), just no free ride.
# The SSR server calls Django on 127.0.0.1, outside nginx.
map "$http_sec_fetch_site|$http_sec_fetch_mode|$http_x_mtz_client" $mtz_site_api_fechado {
    default 1;
    "~^same-origin\|(cors|same-origin)\|" 0;
    "~^\|\|.+" 0;
}
limit_req_zone $binary_remote_addr zone=mtz_site_api:10m rate=10r/s;  # per visitor IP

map $uri $mtz_site_antigo {
    default "";
    include /local/dev/mtz-site/deploy-assets/nginx/redirects-site-antigo.map;
}

# /admin and /dashboard: 403 except from these addresses.
geo $mtz_admin_fechado {
    default 1;
    187.102.183.170 0;  # Metricaz (fixed IP); from outside, through the VPN (it routes this server via the office)
}

server {
    listen 80;
    listen [::]:80;
    server_name metricaz.com www.metricaz.com;

    # Let's Encrypt (http challenge): same folder as nginx's default site, which answers the first
    # certificate before this config can be installed (it needs the certificate files). See README.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://metricaz.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.metricaz.com;

    ssl_certificate /etc/letsencrypt/live/metricaz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/metricaz.com/privkey.pem;

    return 301 https://metricaz.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name metricaz.com;

    # Certificate for metricaz.com and www.metricaz.com.
    ssl_certificate /etc/letsencrypt/live/metricaz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/metricaz.com/privkey.pem;

    include /etc/nginx/snippets/mtz-site-common.conf;  # nginx/mtz-site-common.conf, copied by install.sh
}
