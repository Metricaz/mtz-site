# Metricaz site (UAT) — /etc/nginx/sites-available/mtz-site.conf
#   Django (gunicorn) on 127.0.0.1:8101: /api, /admin, dashboard login/logout, /sitemap.xml, /robots.txt
#   Node SSR (server.js) on 127.0.0.1:8100: every other page
#   Straight from disk: /static (collectstatic), /media (uploads), /assets (React build)
#   Addresses of the old WordPress site: 301 to the new pages (deploy-assets/nginx/redirects-site-antigo.map)

map $uri $mtz_site_antigo {
    default "";
    include /local/dev/mtz-site/deploy-assets/nginx/redirects-site-antigo.map;
}

server {
    listen 80;
    listen [::]:80;
    server_name mtz-site.dev.i.metricaz.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mtz-site.dev.i.metricaz.com;

    # Wildcard certificate *.dev.i.metricaz.com (same as the other sites on this server).
    ssl_certificate /etc/letsencrypt/live/dev.i.metricaz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.i.metricaz.com/privkey.pem;

    # Test environment: keep it out of search engines (and AI crawlers) so it never competes with
    # metricaz.com (the production config, mtz-site-prd.conf, has no such line). robots.txt keeps
    # allowing crawling on purpose: a crawler blocked by robots.txt never sees this header.
    add_header X-Robots-Tag "noindex, nofollow" always;

    include /etc/nginx/snippets/mtz-site-common.conf;  # nginx/mtz-site-common.conf, copied by install.sh
}
