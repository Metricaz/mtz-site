# Metricaz site (UAT) — /etc/nginx/sites-available/mtz-site.conf
#   Django (gunicorn) on 127.0.0.1:8101: /api, /admin, dashboard login/logout
#   Node SSR (server.js) on 127.0.0.1:8100: every other page
#   Straight from disk: /static (collectstatic), /media (uploads), /assets (React build)

server {
    listen 80;
    listen [::]:80;
    server_name mtz-site.dev.i.metricaz.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mtz-site.dev.i.metricaz.com;

    # Wildcard certificate *.dev.i.metricaz.com (same as the other sites on this server).
    ssl_certificate /etc/letsencrypt/live/dev.i.metricaz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.i.metricaz.com/privkey.pem;

    client_max_body_size 20m;  # image uploads in the admin

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /static/ {
        alias /srv/mtz-site/backend/staticfiles/;
        expires 7d;
    }

    location /media/ {
        alias /srv/mtz-site/backend/media/;
        expires 7d;
    }

    # Hashed file names: safe to cache forever.
    location /assets/ {
        alias /srv/mtz-site/dist/client/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~ ^/(api|admin|dashboard/login|dashboard/logout)(/|$) {
        proxy_pass http://127.0.0.1:8101;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
