# Shared by the UAT and production sites (included inside their `server` on 443).
# install.sh copies it to /etc/nginx/snippets/ with the project folder of that server.
client_max_body_size 20m;  # image uploads in the admin

# Metricaz CA certificates (public) for whoever needs them: no link on the site, kept out of search.
location /ca/ {
    alias /local/dev/mtz-site/deploy-assets/ca/;
    index index.html;
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    types {
        text/html html;
        application/x-x509-ca-cert crt;
        application/x-pem-file pem;
    }
}
location = /ca {
    return 301 /ca/;
}

# nginx's own 403 (admin outside the office): just "Acesso negado". Django's 403s pass through.
error_page 403 /negado.html;
location = /negado.html {
    internal;
    alias /local/dev/mtz-site/deploy-assets/negado.html;
}

if ($mtz_site_antigo) {
    return 301 $mtz_site_antigo$is_args$args;
}

gzip on;
gzip_vary on;  # caches in between keep the compressed and the plain copy apart
gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

location /static/ {
    alias /local/dev/mtz-site/backend/staticfiles/;
    expires 7d;
}

location /media/ {
    alias /local/dev/mtz-site/backend/media/;
    expires 7d;
}

# Hashed file names: safe to cache forever.
location /assets/ {
    alias /local/dev/mtz-site/dist/client/assets/;
    # one header (expires would add a second); no "always": a missing file (404) must not be cached for a year
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location ~ ^/(sitemap\.xml|robots\.txt)$ {
    proxy_pass http://127.0.0.1:8101;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
}

# Admin, dashboard and API: never in search engines or AI answers, not even the login page
# (robots.txt also disallows /admin/ and /dashboard/).
# Admin and dashboard only from the addresses each site lets in ($mtz_admin_fechado, a geo in its conf);
# the API stays open: the contact form posts to it and the rest needs a login.
location ~ ^/api(/|$) {
    if ($mtz_site_api_fechado) {
        return 404;
    }
    limit_req zone=mtz_site_api burst=40 nodelay;
    limit_req_status 429;
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
    proxy_pass http://127.0.0.1:8101;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
}

location ~ ^/(admin|dashboard/login|dashboard/logout)(/|$) {
    if ($mtz_admin_fechado) {
        return 403;
    }
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
    proxy_pass http://127.0.0.1:8101;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
}

location /dashboard {
    if ($mtz_admin_fechado) {
        return 403;
    }
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
    proxy_pass http://127.0.0.1:8100;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
}

location / {
    proxy_pass http://127.0.0.1:8100;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
}
