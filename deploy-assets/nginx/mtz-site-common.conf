# Shared by the UAT and production sites (included inside their `server` on 443).
# install.sh copies it to /etc/nginx/snippets/ with the project folder of that server.
client_max_body_size 20m;  # image uploads in the admin

if ($mtz_site_antigo) {
    return 301 $mtz_site_antigo$is_args$args;
}

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;

location /static/ {
    alias /local/dev/mtz-site/backend/staticfiles/;
    expires 7d;
}

location /media/ {
    alias /local/dev/mtz-site/backend/media/;
    expires 7d;
}

# Hashed file names: safe to cache forever.
location /assets/ {
    alias /local/dev/mtz-site/dist/client/assets/;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

location ~ ^/(api|admin|dashboard/login|dashboard/logout|sitemap\.xml|robots\.txt)(/|$) {
    proxy_pass http://127.0.0.1:8101;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
}

location / {
    proxy_pass http://127.0.0.1:8100;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
}
