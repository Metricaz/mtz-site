<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Dashboard Metricaz</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap">
  <style>
    /* Same tokens and Card/Input/Button styles as src/index.css and src/components/ui/* (the old React login card). */
    :root {
      --background: 248 19% 12%;
      --foreground: 36 30% 95%;
      --card: 248 18% 15%;
      --primary: 12 100% 62%;
      --primary-foreground: 248 19% 12%;
      --muted-foreground: 36 12% 70%;
      --destructive: 0 84% 60%;
      --border: 248 14% 24%;
      --input: 248 14% 22%;
      --ring: 12 100% 62%;
      --radius: 1rem;
    }
    *, *::before, *::after { box-sizing: border-box; border: 0 solid hsl(var(--border)); }
    html, body { margin: 0; }
    body {
      background: hsl(var(--background));
      color: hsl(var(--foreground));
      font-family: 'Inter', system-ui, sans-serif;
      font-feature-settings: 'ss01', 'cv11';
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      line-height: 1.5;
    }
    ::selection { background: hsl(var(--primary)); color: hsl(var(--primary-foreground)); }
    .page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
    .card {
      width: 100%; max-width: 28rem; padding: 2rem;
      border-width: 1px; border-radius: var(--radius);
      background: hsl(var(--card)); color: hsl(var(--foreground));
      box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
    }
    .header { margin-bottom: 2rem; }
    h1 { margin: 0 0 0.5rem; font-size: 1.875rem; line-height: 2.25rem; font-weight: 700; }
    .subtitle { margin: 0; color: hsl(var(--muted-foreground)); }
    form > * + * { margin-top: 1rem; }
    label { display: block; margin-bottom: 0.5rem; font-size: 0.875rem; line-height: 1.25rem; font-weight: 500; }
    input[type="text"], input[type="password"] {
      display: flex; width: 100%; height: 2.5rem; padding: 0.5rem 0.75rem;
      border: 1px solid hsl(var(--input)); border-radius: calc(var(--radius) - 4px);
      background: hsl(var(--background)); color: inherit;
      font: inherit; font-size: 0.875rem; line-height: 1.25rem;
    }
    input::placeholder { color: hsl(var(--muted-foreground)); }
    input:focus-visible, button:focus-visible {
      outline: none;
      box-shadow: 0 0 0 2px hsl(var(--background)), 0 0 0 4px hsl(var(--ring));
    }
    .error {
      padding: 0.75rem 1rem; border: 1px solid hsl(var(--destructive)); border-radius: 0.25rem;
      background: hsl(var(--destructive) / 0.1); color: hsl(var(--destructive));
    }
    button {
      display: inline-flex; align-items: center; justify-content: center;
      width: 100%; height: 2.5rem; padding: 0.5rem 1rem;
      border-radius: calc(var(--radius) - 4px); cursor: pointer;
      background: hsl(var(--primary)); color: hsl(var(--primary-foreground));
      font: inherit; font-size: 0.875rem; line-height: 1.25rem; font-weight: 500;
      transition: background-color 150ms cubic-bezier(0.4, 0, 0.2, 1);
    }
    button:hover { background: hsl(var(--primary) / 0.9); }
  </style>
</head>
<body>
  <div class="page">
    <div class="card">
      <div class="header">
        <h1>Dashboard Metricaz</h1>
        <p class="subtitle">Entre com suas credenciais</p>
      </div>

      <form method="post" action="{% url 'login' %}">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">

        <div>
          <label for="{{ form.username.id_for_label }}">Usuário</label>
          <input type="text" name="{{ form.username.html_name }}" id="{{ form.username.id_for_label }}"
                 value="{{ form.username.value|default_if_none:'' }}" autocomplete="username"
                 autocapitalize="none" placeholder="seu usuário" required autofocus>
        </div>

        <div>
          <label for="{{ form.password.id_for_label }}">Senha</label>
          <input type="password" name="{{ form.password.html_name }}" id="{{ form.password.id_for_label }}"
                 autocomplete="current-password" placeholder="••••••••" required>
        </div>

        {% for error in form.non_field_errors %}
          <div class="error">{{ error }}</div>
        {% endfor %}

        <button type="submit">Entrar</button>
      </form>
    </div>
  </div>
</body>
</html>
